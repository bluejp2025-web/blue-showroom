<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="BLUEのコンセプトショールームを歩きながら、車・バイクの買取サービスをご案内します。イメージ空間です。"><title>BLUE SHOWROOM WALK | 上下スクロール切替・金枠発光版</title><style>
:root{--gold:#e6c68c;--text:#fff5e3}*{box-sizing:border-box}body{margin:0;background:#09181c;color:var(--text);font-family:Georgia,"Yu Mincho","Hiragino Mincho ProN",serif}button,a{touch-action:manipulation}.top{min-height:70px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px max(14px,3vw);background:linear-gradient(95deg,#112e34,#121e24);border-bottom:1px solid #816439}.brand{font-size:clamp(20px,3vw,32px);letter-spacing:.15em;font-weight:700}.brand small{display:block;color:#d4b687;font-size:10px;letter-spacing:.16em;font-weight:400}.topright{text-align:right;font-size:12px;line-height:1.7;color:#dac49e}.stage{min-height:40vh;display:flex;justify-content:center;align-items:center;position:relative;background:#050a0b;overflow:hidden}.canvas{display:inline-block;position:relative;line-height:0;max-width:100%}.canvas>img{display:block;max-width:100%;max-height:calc(100dvh - 207px);width:auto;height:auto;object-fit:contain}.hotspot{position:absolute;border:0;background:transparent;cursor:pointer;padding:0;z-index:7;isolation:isolate}
.hotspot:focus-visible{outline:2px solid #fff7d7;outline-offset:3px}
/* Gold trim lighting, sampled from the photographed sign pixels.
   No rectangular borders or floor effects. Source images are untouched. */
.edgeglow[hidden]{display:none}.edgeglow{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;
  z-index:5;pointer-events:none;opacity:0;animation:trimBreath 4s ease-in-out infinite}
@keyframes trimBreath{0%,100%{opacity:.12}46%,62%{opacity:1}}
@media(prefers-reduced-motion:reduce){.edgeglow{animation:none;opacity:.7}}
.nav{position:absolute;top:48%;transform:translateY(-50%);z-index:8;border:1px solid #f2d7a680;background:#142b31dd;color:#ffecce;font-size:24px;width:42px;height:48px;cursor:pointer}.nav.prev{left:0;border-radius:0 9px 9px 0}.nav.next{right:0;border-radius:9px 0 0 9px}.nav:disabled{opacity:.2}.guide{position:relative;display:flex;align-items:center;justify-content:center;gap:18px;flex-wrap:wrap;text-align:center;background:linear-gradient(95deg,#14282d,#1e2b2d,#14282d);border-block:1px solid #a07a4a6b;padding:11px 16px;min-height:72px;font-family:system-ui,"Hiragino Kaku Gothic ProN",sans-serif}.guide .num{color:#e5bf82;font-size:12px;letter-spacing:.15em}.guide b{display:block;color:#fff6e1;font:600 clamp(15px,2.2vw,21px) Georgia,serif;letter-spacing:.02em}.guide .ja{font-size:clamp(12px,1.6vw,15px);color:#e6dbc7}.guide .action{display:inline-block;border:1px solid #cfab6f;background:#e1bb78;color:#111f23;padding:10px 15px;border-radius:99px;text-decoration:none;font-size:13px;font-weight:700;white-space:nowrap}.guide .action:hover,.guide .action:focus-visible{background:#ffdb97}.guide .sub{color:#d1c4ac;font-size:11px;flex-basis:100%}.strip{display:flex;justify-content:center;gap:9px;overflow-x:auto;padding:10px 12px;background:#11262b}.thumb{background:#15252a;border:1px solid #736244;border-radius:5px;color:#e3d4bc;cursor:pointer;min-width:98px;width:106px;padding:4px 4px 6px}.thumb[aria-current="true"]{border:2px solid #e9c278;box-shadow:0 0 8px #eacb7855}.thumb img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}.thumb span{font-size:10px;display:block;margin-top:5px}.footer{font:11px/1.65 system-ui,sans-serif;color:#bbb7ad;text-align:center;padding:9px 15px 19px}.footer a{color:#d5b879} @media(max-width:600px){.top{min-height:58px}.canvas>img{max-height:62dvh}.stage{min-height:25vh}.topright{font-size:10px}.nav{width:34px;height:42px;font-size:20px}.guide{gap:8px}.thumb{min-width:86px;width:90px}}
/* Scene switching by wheel / horizontal mobile swipe. Original photos and lighting unchanged. */
.scroll-hint{position:absolute;z-index:6;bottom:10px;left:50%;transform:translateX(-50%);font:12px/1.4 system-ui,sans-serif;letter-spacing:.08em;color:#fff2d1;background:#10292dbb;border:1px solid #d6b67e77;border-radius:99px;padding:5px 13px;pointer-events:none;white-space:nowrap;box-shadow:0 2px 8px #0005}
@media(max-width:600px){.scroll-hint{bottom:5px;font-size:10px;padding:4px 9px}}
/* Keep vertical page scrolling; capture horizontal swipes even inside a wide Google Sites iframe. */
@media(pointer:coarse){.stage{touch-action:pan-y pinch-zoom}}

/* Smooth scene fade; sign glow itself remains unchanged. */
.canvas{opacity:1;transition:opacity .9s ease-in-out}
.canvas.is-fading{opacity:0;transition-duration:.45s}
@media(prefers-reduced-motion:reduce){.canvas,.canvas.is-fading{transition-duration:.01s}}
</style></head><body><header class="top" aria-hidden="true"></header><main><div class="stage"><button class="nav prev" aria-label="前のシーン" id="prev">❮</button><div class="canvas" id="canvas"><img id="sceneImg" alt="BLUEバーチャルショールーム" src="00.jpg"><img class="edgeglow" id="edgeglow" src="edge-glow-01.png" alt="" aria-hidden="true" hidden><button id="hotspot" class="hotspot" aria-label="光る看板を開く" hidden></button></div><button class="nav next" id="next" aria-label="次のシーン">❯</button><div class="scroll-hint" id="scrollHint">↓ スクロールで次のシーンへ</div></div><div class="guide" id="guide" aria-live="polite"></div><div class="strip" id="thumbs"></div><div class="footer">この空間はBLUEの世界観を表現した架空のショールームです。<br>看板そのものは動かさず、看板の実際の金色の縁だけが、ゆっくり輝いて次のご案内をお知らせします。</div></main><script>
const scenes=[["WELCOME", "00"], ["ENTRANCE", "01"], ["CONSULTATION", "02"], ["APPRAISAL", "03"], ["KIDS ROOM", "04"], ["CAFÉ SPACE", "05"], ["APPAREL & FRONT", "06"]];
const signs=[["Why Choose BLUE", "BLUEが選ばれる理由", "kaitori.html", [90.0, 56.5, 9.2, 27.0]], ["How It Works", "買取の流れ", "flow.html", [90.0, 57.5, 8.9, 24.0]], ["All Vehicles Welcome", "どんなお車・バイクもご相談ください", "vehicles.html", [89.0, 56.5, 10.1, 28.0]], ["Chat & Quote", "LINE相談・無料査定", "contact.html", [85.5, 53.5, 9.8, 28.0]], ["ABOUT BLUE", "BLUEについて", "about.html", [82.3, 43.5, 12.0, 31.0]], ["ACCESS・PRIVACY", "アクセス・個人情報保護", "access.html", [87.4, 40.7, 9.0, 25.0]]];
let current=0;
const q=new URLSearchParams(location.search);const incoming=Number(q.get('return'));
const img=document.getElementById('sceneImg'),hotspot=document.getElementById('hotspot'),edge=document.getElementById('edgeglow'),guide=document.getElementById('guide'),thumbs=document.getElementById('thumbs');
const srcFor=i=>String(i).padStart(2,'0')+'.jpg';
thumbs.innerHTML=scenes.map((s,i)=>`<button class="thumb" data-scene="${i}" aria-label="${s[0]} ${s[1]}"><img loading="lazy" src="${srcFor(i)}" alt=""><span>${String(i).padStart(2,'0')} · ${s[0]}</span></button>`).join('');
thumbs.addEventListener('click',e=>{const b=e.target.closest('button[data-scene]');if(b)show(Number(b.dataset.scene))});
function linkFor(i){return signs[i-1][2]+'?from='+i}
function renderScene(i){current=Math.max(0,Math.min(6,i));document.getElementById('scrollHint').textContent=window.matchMedia('(max-width:600px) and (pointer:coarse)').matches?(current===6?'→ 右スワイプで前へ':current===0?'← 左スワイプで入館':'← 左スワイプで次へ / 右で戻る'):(current===6?'↑ スクロールで前のシーンへ':current===0?'↓ スクロールで入館':'↓ スクロールで次のシーンへ');img.src=srcFor(current);img.alt=String(current).padStart(2,'0')+' '+scenes[current][0]+' · BLUEショールーム';document.getElementById('prev').disabled=current===0;document.getElementById('next').disabled=current===6;document.querySelectorAll('.thumb').forEach((b,n)=>b.setAttribute('aria-current',n===current?'true':'false'));
  if(current===0){hotspot.hidden=true;edge.hidden=true;guide.innerHTML='<div><b>BLUE CONCEPT SHOWROOM</b><div class="ja">この先はBLUEの世界観を表現した架空のショールームです</div></div><button type="button" class="action" id="enter">入館する →</button>';document.getElementById('enter').onclick=()=>show(1)}
  else {const s=signs[current-1],r=s[3];hotspot.hidden=false;edge.hidden=false;edge.src='edge-glow-'+String(current).padStart(2,'0')+'.png';hotspot.style.left=r[0]+'%';hotspot.style.top=r[1]+'%';hotspot.style.width=r[2]+'%';hotspot.style.height=r[3]+'%';
  /* Per-pixel gold border overlay uses the original sign, not a square halo. */
  hotspot.setAttribute('aria-label',String(current)+'番 '+s[0]+'、'+s[1]+'。クリックして詳細を見る');hotspot.onclick=()=>location.href=linkFor(current);guide.innerHTML='<div><b>'+s[0]+'</b><div class="ja">'+s[1]+'</div></div><a class="action" href="'+linkFor(current)+'">詳しくはこちら →</a><div class="sub">金色に光る看板をクリック・タップしても開けます。案内ページから戻ると次の看板が光ります。</div>';}
}

// Preload showroom photos and their gold-edge light overlays.
scenes.forEach((_,i)=>{
  const preload=new Image();preload.src=srcFor(i);
  if(i>0){const glow=new Image();glow.src='edge-glow-'+String(i).padStart(2,'0')+'.png';}
});
let transitioning=false;
const showroomCanvas=document.getElementById('canvas');
function show(i){
  const target=Math.max(0,Math.min(scenes.length-1,i));
  if(transitioning||target===current)return;
  transitioning=true;
  showroomCanvas.classList.add('is-fading');
  const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  window.setTimeout(()=>{
    renderScene(target);
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      showroomCanvas.classList.remove('is-fading');
    }));
    window.setTimeout(()=>{transitioning=false;},reduced?30:950);
  },reduced?10:450);
}
document.getElementById('prev').onclick=()=>show(current-1);document.getElementById('next').onclick=()=>show(current+1);
document.addEventListener('keydown',e=>{
  if(e.target.matches('input,textarea,select,[contenteditable="true"]'))return;
  if(e.key==='ArrowRight'||e.key==='ArrowDown'){e.preventDefault();show(current+1)}
  else if(e.key==='ArrowLeft'||e.key==='ArrowUp'){e.preventDefault();show(current-1)}
});
// Mouse wheel / trackpad: advance one still image at a time without moving its contents.
let wheelAccum=0,lastWheelSceneAt=0,wheelDirection=0;
window.addEventListener('wheel',e=>{
  if(e.ctrlKey||e.metaKey||!e.deltaY)return; // keep browser zoom gestures intact
  // At either endpoint normal page scrolling remains available.
  const dir=e.deltaY>0?1:-1;
  if((dir>0&&current===6)||(dir<0&&current===0))return;
  e.preventDefault();
  const now=performance.now();
  if(transitioning||now-lastWheelSceneAt<700)return;
  if(dir!==wheelDirection){wheelAccum=0;wheelDirection=dir;}
  const amount=Math.abs(e.deltaY)*(e.deltaMode===1?16:e.deltaMode===2?500:1);
  wheelAccum+=amount;
  if(wheelAccum>=45){wheelAccum=0;lastWheelSceneAt=now;show(current+dir);}
},{passive:false});
// Horizontal touch gestures on the showroom image.
// Google Sites can embed a page at desktop-like CSS widths on smartphones;
// avoid requiring max-width:600px or pointer:coarse for recognizing real touch events.
const swipeArea=document.querySelector('.stage');
const isPhoneSwipe=()=>window.matchMedia('(pointer:coarse)').matches ||
  (navigator.maxTouchPoints||0)>0 || window.matchMedia('(max-width:600px)').matches;
let touchStart=null;
swipeArea.addEventListener('touchstart',e=>{
  if(e.touches.length!==1){touchStart=null;return;}
  const p=e.touches[0];
  touchStart={x:p.clientX,y:p.clientY,lastX:p.clientX,lastY:p.clientY,horizontal:false};
},{passive:true});
swipeArea.addEventListener('touchmove',e=>{
  if(!touchStart || e.touches.length!==1)return;
  const p=e.touches[0];
  touchStart.lastX=p.clientX;
  touchStart.lastY=p.clientY;
  const dx=p.clientX-touchStart.x,dy=p.clientY-touchStart.y;
  // Let Google Sites handle vertical gestures as usual.
  if(Math.abs(dx)>14 && Math.abs(dx)>Math.abs(dy)*1.25){
    touchStart.horizontal=true;
    if(e.cancelable)e.preventDefault();
  }
},{passive:false});
swipeArea.addEventListener('touchend',e=>{
  if(!touchStart)return;
  const p=e.changedTouches.length?e.changedTouches[0]:null;
  const dx=(p?p.clientX:touchStart.lastX)-touchStart.x;
  const dy=(p?p.clientY:touchStart.lastY)-touchStart.y;
  const horizontal=touchStart.horizontal;
  touchStart=null;
  if(transitioning)return;
  if(Math.abs(dx)>=42 && Math.abs(dx)>Math.abs(dy)*1.25 && horizontal){
    show(current+(dx<0?1:-1));
  }
},{passive:true});
swipeArea.addEventListener('touchcancel',()=>{touchStart=null;},{passive:true});
// Keep help text accurate when the window / orientation changes.
window.addEventListener('resize',()=>{
  const hint=document.getElementById('scrollHint');
  const mobile=isPhoneSwipe();
  hint.textContent=mobile?(current===6?'→ 右スワイプで前へ':current===0?'← 左スワイプで入館':'← 左スワイプで次へ / 右で戻る'):(current===6?'↑ スクロールで前のシーンへ':current===0?'↓ スクロールで入館':'↓ スクロールで次のシーンへ');
});
renderScene(incoming>=1&&incoming<=6?incoming:0);
</script></body></html>
