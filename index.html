<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="BLUEのコンセプトショールームを歩きながら、車・バイクの買取サービスをご案内します。イメージ空間です。"><title>BLUE SHOWROOM WALK | Cタイプ 看板発光＋床ライト確認版</title><style>
:root{--gold:#e6c68c;--text:#fff5e3}*{box-sizing:border-box}body{margin:0;background:#09181c;color:var(--text);font-family:Georgia,"Yu Mincho","Hiragino Mincho ProN",serif}button,a{touch-action:manipulation}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px max(14px,3vw);background:linear-gradient(95deg,#112e34,#121e24);border-bottom:1px solid #816439}.brand{font-size:clamp(20px,3vw,32px);letter-spacing:.15em;font-weight:700}.brand small{display:block;color:#d4b687;font-size:10px;letter-spacing:.16em;font-weight:400}.topright{text-align:right;font-size:12px;line-height:1.7;color:#dac49e}.stage{min-height:40vh;display:flex;justify-content:center;align-items:center;position:relative;background:#050a0b;overflow:hidden}.canvas{display:inline-block;position:relative;line-height:0;max-width:100%}.canvas>img{display:block;max-width:100%;max-height:calc(100dvh - 207px);width:auto;height:auto;object-fit:contain}.hotspot{position:absolute;border:0;background:transparent;cursor:pointer;padding:0;z-index:7;isolation:isolate}
.hotspot:focus-visible{outline:2px solid #fff7d7;outline-offset:3px}
/* C type: a restrained golden halo around the existing sign, and an elliptical
   reflection ONLY on the showroom tile. Image pixels, sign artwork and placement
   remain unchanged. Both effects ignore pointer events. */
.signhalo{position:absolute;z-index:5;pointer-events:none;opacity:0;
  border:clamp(1px,.17vw,3px) solid rgba(255,229,169,.70);
  border-radius:5px;
  box-shadow:0 0 5px 1px rgba(255,237,192,.60),0 0 13px 4px rgba(255,205,122,.46),0 0 24px 6px rgba(247,176,74,.25),inset 0 0 8px rgba(255,232,178,.16);
  transform:perspective(350px) rotateY(-3deg);animation:goldBreath 4s ease-in-out infinite}
.floorlight{position:absolute;z-index:4;pointer-events:none;opacity:0;border-radius:50%;
  background:radial-gradient(ellipse at center,rgba(255,235,174,.60) 0%,rgba(255,214,129,.35) 26%,rgba(255,196,103,.15) 54%,rgba(255,196,103,0) 74%);
  filter:blur(5px);mix-blend-mode:screen;animation:floorBreath 4s ease-in-out infinite}
@keyframes goldBreath{0%,100%{opacity:.35}48%,62%{opacity:.95}}
@keyframes floorBreath{0%,100%{opacity:.22}48%,62%{opacity:.82}}
@media(prefers-reduced-motion:reduce){.signhalo{animation:none;opacity:.65}.floorlight{animation:none;opacity:.55}}
.nav{position:absolute;top:48%;transform:translateY(-50%);z-index:8;border:1px solid #f2d7a680;background:#142b31dd;color:#ffecce;font-size:24px;width:42px;height:48px;cursor:pointer}.nav.prev{left:0;border-radius:0 9px 9px 0}.nav.next{right:0;border-radius:9px 0 0 9px}.nav:disabled{opacity:.2}.guide{position:relative;display:flex;align-items:center;justify-content:center;gap:18px;flex-wrap:wrap;text-align:center;background:linear-gradient(95deg,#14282d,#1e2b2d,#14282d);border-block:1px solid #a07a4a6b;padding:11px 16px;min-height:72px;font-family:system-ui,"Hiragino Kaku Gothic ProN",sans-serif}.guide .num{color:#e5bf82;font-size:12px;letter-spacing:.15em}.guide b{display:block;color:#fff6e1;font:600 clamp(15px,2.2vw,21px) Georgia,serif;letter-spacing:.02em}.guide .ja{font-size:clamp(12px,1.6vw,15px);color:#e6dbc7}.guide .action{display:inline-block;border:1px solid #cfab6f;background:#e1bb78;color:#111f23;padding:10px 15px;border-radius:99px;text-decoration:none;font-size:13px;font-weight:700;white-space:nowrap}.guide .action:hover,.guide .action:focus-visible{background:#ffdb97}.guide .sub{color:#d1c4ac;font-size:11px;flex-basis:100%}.strip{display:flex;justify-content:center;gap:9px;overflow-x:auto;padding:10px 12px;background:#11262b}.thumb{background:#15252a;border:1px solid #736244;border-radius:5px;color:#e3d4bc;cursor:pointer;min-width:98px;width:106px;padding:4px 4px 6px}.thumb[aria-current="true"]{border:2px solid #e9c278;box-shadow:0 0 8px #eacb7855}.thumb img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}.thumb span{font-size:10px;display:block;margin-top:5px}.footer{font:11px/1.65 system-ui,sans-serif;color:#bbb7ad;text-align:center;padding:9px 15px 19px}.footer a{color:#d5b879} @media(max-width:600px){.canvas>img{max-height:62dvh}.stage{min-height:25vh}.topright{font-size:10px}.nav{width:34px;height:42px;font-size:20px}.guide{gap:8px}.thumb{min-width:86px;width:90px}}
</style></head><body><header class="top"><div class="brand">BLUE<small>MOTOR VEHICLE TRADING · 2025</small></div><div class="topright">SHOWROOM WALK<br>00–06 · CONCEPT SHOWROOM</div></header><main><div class="stage"><button class="nav prev" aria-label="前のシーン" id="prev">❮</button><div class="canvas" id="canvas"><img id="sceneImg" alt="BLUEバーチャルショールーム" src="00.jpg"><div class="floorlight" id="floorlight" aria-hidden="true"></div><div class="signhalo" id="signhalo" aria-hidden="true"></div><button id="hotspot" class="hotspot" aria-label="光る看板を開く" hidden></button></div><button class="nav next" id="next" aria-label="次のシーン">❯</button></div><div class="guide" id="guide" aria-live="polite"></div><div class="strip" id="thumbs"></div><div class="footer">この空間はBLUEの世界観を表現した架空のショールームです。<br>看板そのものは動かさず、看板の穏やかな金色の発光と、足元のタイルへの淡い光で次のご案内をお知らせします。</div></main><script>
const scenes=[["WELCOME", "00"], ["ENTRANCE", "01"], ["CONSULTATION", "02"], ["APPRAISAL", "03"], ["KIDS ROOM", "04"], ["CAFÉ SPACE", "05"], ["APPAREL & FRONT", "06"]];
const signs=[["Why Choose BLUE", "BLUEが選ばれる理由", "kaitori.html", [90.0, 56.5, 9.2, 27.0]], ["How It Works", "買取の流れ", "flow.html", [90.0, 57.5, 8.9, 24.0]], ["All Vehicles Welcome", "どんなお車・バイクもご相談ください", "vehicles.html", [89.0, 56.5, 10.1, 28.0]], ["Chat & Quote", "LINE相談・無料査定", "contact.html", [85.5, 53.5, 9.8, 28.0]], ["ABOUT BLUE", "BLUEについて", "about.html", [82.3, 43.5, 12.0, 31.0]], ["ACCESS・PRIVACY", "アクセス・個人情報保護", "access.html", [87.4, 40.7, 9.0, 25.0]]];
let current=0;
const q=new URLSearchParams(location.search);const incoming=Number(q.get('return'));
const img=document.getElementById('sceneImg'),hotspot=document.getElementById('hotspot'),halo=document.getElementById('signhalo'),floor=document.getElementById('floorlight'),guide=document.getElementById('guide'),thumbs=document.getElementById('thumbs');
const srcFor=i=>String(i).padStart(2,'0')+'.jpg';
thumbs.innerHTML=scenes.map((s,i)=>`<button class="thumb" data-scene="${i}" aria-label="${s[0]} ${s[1]}"><img loading="lazy" src="${srcFor(i)}" alt=""><span>${String(i).padStart(2,'0')} · ${s[0]}</span></button>`).join('');
thumbs.addEventListener('click',e=>{const b=e.target.closest('button[data-scene]');if(b)show(Number(b.dataset.scene))});
function linkFor(i){return signs[i-1][2]+'?from='+i}
function show(i){current=Math.max(0,Math.min(6,i));img.src=srcFor(current);img.alt=String(current).padStart(2,'0')+' '+scenes[current][0]+' · BLUEショールーム';document.getElementById('prev').disabled=current===0;document.getElementById('next').disabled=current===6;document.querySelectorAll('.thumb').forEach((b,n)=>b.setAttribute('aria-current',n===current?'true':'false'));
  if(current===0){hotspot.hidden=true;halo.style.display='none';floor.style.display='none';guide.innerHTML='<div class="num">00 · WELCOME</div><div><b>BLUE CONCEPT SHOWROOM</b><div class="ja">この先はBLUEの世界観を表現した架空のショールームです</div></div><button type="button" class="action" id="enter">入館する →</button>';document.getElementById('enter').onclick=()=>show(1)}
  else {const s=signs[current-1],r=s[3];hotspot.hidden=false;halo.style.display='block';floor.style.display='block';hotspot.style.left=r[0]+'%';hotspot.style.top=r[1]+'%';hotspot.style.width=r[2]+'%';hotspot.style.height=r[3]+'%';
  /* Only overlay effects: sign remains exactly as photographed. */
  halo.style.left=(r[0]+r[2]*.07)+'%';halo.style.top=(r[1]+r[3]*.05)+'%';
  halo.style.width=(r[2]*.86)+'%';halo.style.height=(r[3]*.88)+'%';
  /* Floor reflection sits at the sign's feet and stays on right-hand tile.
     Limit its left edge to the right of the carpet, which is left of sign faces. */
  const fx=Math.max(r[0]-r[2]*.28, 78), fy=Math.min(r[1]+r[3]*.82,93);
  floor.style.left=fx+'%';floor.style.top=fy+'%';
  floor.style.width=(Math.min(99.8-fx,r[2]*1.30))+'%';
  floor.style.height=(Math.min(99-fy,Math.max(3,r[3]*.31)))+'%';
  hotspot.setAttribute('aria-label',String(current)+'番 '+s[0]+'、'+s[1]+'。クリックして詳細を見る');hotspot.onclick=()=>location.href=linkFor(current);guide.innerHTML='<div class="num">GUIDE '+String(current).padStart(2,'0')+'</div><div><b>'+s[0]+'</b><div class="ja">'+s[1]+'</div></div><a class="action" href="'+linkFor(current)+'">詳しくはこちら →</a><div class="sub">金色に光る看板をクリック・タップしても開けます。案内ページから戻ると次の看板が光ります。</div>';}
}
document.getElementById('prev').onclick=()=>show(current-1);document.getElementById('next').onclick=()=>show(current+1);
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')show(current+1);else if(e.key==='ArrowLeft')show(current-1)});
show(incoming>=1&&incoming<=6?incoming:0);
</script></body></html>
