  e.preventDefault();
  const now=performance.now();
  if(transitioning||now-lastWheelSceneAt<700)return;
  if(dir!==wheelDirection){wheelAccum=0;wheelDirection=dir;}
  const amount=Math.abs(e.deltaY)*(e.deltaMode===1?16:e.deltaMode===2?500:1);
  wheelAccum+=amount;
  if(wheelAccum>=45){wheelAccum=0;lastWheelSceneAt=now;show(current+dir);}
},{passive:false});
// Horizontal touch gestures on the showroom image.
// Google Sites can embed a page at desktop-like CSS widths on smartphones;
// avoid requiring max-width:600px or pointer:coarse for recognizing real touch events.
const swipeArea=document.querySelector('.stage');
const isPhoneSwipe=()=>window.matchMedia('(pointer:coarse)').matches ||
  (navigator.maxTouchPoints||0)>0 || window.matchMedia('(max-width:600px)').matches;
let touchStart=null;
swipeArea.addEventListener('touchstart',e=>{
  if(e.touches.length!==1){touchStart=null;return;}
  const p=e.touches[0];
  touchStart={x:p.clientX,y:p.clientY,lastX:p.clientX,lastY:p.clientY,horizontal:false};
},{passive:true});
swipeArea.addEventListener('touchmove',e=>{
  if(!touchStart || e.touches.length!==1)return;
  const p=e.touches[0];
  touchStart.lastX=p.clientX;
  touchStart.lastY=p.clientY;
  const dx=p.clientX-touchStart.x,dy=p.clientY-touchStart.y;
  // Let Google Sites handle vertical gestures as usual.
  if(Math.abs(dx)>14 && Math.abs(dx)>Math.abs(dy)*1.25){
    touchStart.horizontal=true;
    if(e.cancelable)e.preventDefault();
  }
},{passive:false});
swipeArea.addEventListener('touchend',e=>{
  if(!touchStart)return;
  const p=e.changedTouches.length?e.changedTouches[0]:null;
  const dx=(p?p.clientX:touchStart.lastX)-touchStart.x;
  const dy=(p?p.clientY:touchStart.lastY)-touchStart.y;
  const horizontal=touchStart.horizontal;
  touchStart=null;
  if(transitioning)return;
  if(Math.abs(dx)>=42 && Math.abs(dx)>Math.abs(dy)*1.25 && horizontal){
    show(current+(dx<0?1:-1));
  }
},{passive:true});
swipeArea.addEventListener('touchcancel',()=>{touchStart=null;},{passive:true});
// Keep help text accurate when the window / orientation changes.
window.addEventListener('resize',()=>{
  const hint=document.getElementById('scrollHint');
  const mobile=isPhoneSwipe();
  hint.textContent=mobile?(current===6?'→ 右スワイプで前へ':current===0?'← 左スワイプで入館':'← 左スワイプで次へ / 右で戻る'):(current===6?'↑ スクロールで前のシーンへ':current===0?'↓ スクロールで入館':'↓ スクロールで次のシーンへ');
});
renderScene(incoming>=1&&incoming<=6?incoming:0);
trackShowroomRoom(current);
</script></body></html>
