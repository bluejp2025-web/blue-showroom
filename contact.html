<style>
:root{--teal:#0a4545;--teal-light:#0c7774;--gold:#d7af68;--cream:#fff9eb}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(ellipse at 50% 0%,#3a716a,#0a3134 65%,#082326);color:var(--cream);font-family:"Yu Mincho","Hiragino Mincho ProN",Georgia,serif}a{color:inherit}
@keyframes pageIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.page{max-width:1240px;margin:0 auto;padding:0 clamp(0px,2vw,26px) 24px;animation:pageIn 1s ease-out both}
.poster{position:relative;width:100%;overflow:hidden;isolation:isolate;box-shadow:0 18px 60px #0008;background:#463b31}
.poster img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}
.hotspot{position:absolute;z-index:3;display:block;border-radius:18px;background:transparent;text-decoration:none;cursor:pointer;transition:box-shadow .2s,background-color .2s}
.hotspot:hover,.hotspot:focus-visible{background:#fff2ac14;box-shadow:0 0 0 3px #ffe7a6,0 0 22px #f9d276;outline:none}
.hotspot:active{background:#fff2ac30}
/* Click regions mapped to the supplied 1199 x 1312 poster. */
.hotspot.back{left:4.6%;top:3.7%;width:21.5%;height:4.2%;border-radius:4px}
.hotspot.line{left:7.9%;top:73.1%;width:24.6%;height:5.2%;border-radius:40px}
.hotspot.form{left:36.6%;top:73.1%;width:24.6%;height:5.2%;border-radius:40px}
.hotspot.phone{left:67.4%;top:71%;width:26%;height:5.4%;border-radius:9px}
/* Correct the poster's decorative mockup hours without modifying its other artwork. */
.hours-correction{position:absolute;z-index:2;left:68.4%;top:78.35%;width:23.7%;height:2.5%;background:linear-gradient(100deg,#f7edd9,#fbf1df 50%,#f6ead2);color:#1d2525;display:flex;align-items:center;justify-content:center;white-space:nowrap;font:700 clamp(7px,1.02vw,13px)/1.2 "Yu Mincho","Hiragino Mincho ProN",serif;letter-spacing:-.02em;border-radius:3px}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding:26px 14px 8px}
.action{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:92px;padding:13px 12px;border:1px solid var(--gold);text-decoration:none;background:linear-gradient(145deg,#fff8e9,#efdfc0);color:#163f41;text-align:center;box-shadow:0 5px 12px #0003;transition:transform .2s,filter .2s}
.action strong{font:700 clamp(15px,1.8vw,19px)/1.5 "Yu Mincho",serif}.action span{font:12px/1.6 system-ui,sans-serif;margin-top:4px}.action:hover,.action:focus-visible{transform:translateY(-3px);filter:brightness(1.05)}
.details{text-align:center;color:#f2e6d2;padding:19px 16px 8px;font:13px/1.9 system-ui,sans-serif}.details strong{font-weight:700}.details p{margin:0 0 9px}.details a{text-underline-offset:4px}
.bottom{text-align:center;padding:17px}.bottom a{border-bottom:1px solid var(--gold);padding-bottom:5px;text-decoration:none;font:14px system-ui,sans-serif}
.footer{text-align:center;font:11px/1.7 system-ui,sans-serif;color:#d4c4ab;padding:12px 10px 14px}
@media(max-width:650px){.page{padding:0 0 15px}.actions{grid-template-columns:1fr;padding:20px 15px 7px;gap:10px}.action{min-height:68px}.action strong{font-size:17px}.hours-correction{font-size:clamp(4px,1.05vw,8px)}.hotspot{border-radius:5px}}
@media(prefers-reduced-motion:reduce){.page{animation:none}.hotspot,.action{transition:none}}
</style>
